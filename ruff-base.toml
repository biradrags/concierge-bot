# Canonical Ruff config for all bira bots.
# SOURCE OF TRUTH: _infra/bira-scaffold/template/ruff-base.toml (this file).
# _devtools/ruff-base.toml - generated mirror (`make sync-devtools` in bira-scaffold).
#
# Each bot is a SEPARATE git repo, so this file is VENDORED (copied) into each
# project root and extended locally - cross-repo `extend` would break in CI/Docker
# where only the bot's own repo is checked out. New projects get it from copier;
# existing repos re-vendor on touch.
#
# In a bot's pyproject.toml:
#   [tool.ruff]
#   extend = "ruff-base.toml"        # vendored copy in the project root
#   [tool.ruff.lint.per-file-ignores]
#   ...                              # project-specific ignores stay here
#
# Propagate changes: edit THIS file, then copy into each bot (or `make sync-devtools`).

target-version = "py312"
line-length = 88

[lint]
select = [
  "E", "F", "W",     # pycodestyle / pyflakes
  "B",               # bugbear
  "BLE",             # blind except
  "I",               # import sorting
  "UP",              # pyupgrade
  "SIM",             # simplify
  "C4",              # comprehensions
  "RET",             # return smells
  "ARG",             # unused args
  "ANN",             # type annotations
  "S",               # security (incl. try/except/pass)
  "RUF",             # ruff-specific
  "ASYNC",           # async anti-patterns
  "DTZ",             # datetime tz safety
  "TRY",             # try/except hygiene
  "LOG",             # logging issues
  "G",               # logging format strings
  "A005",            # модуль затеняет stdlib (flake8-builtins, только это правило: A001-A004 шумят на переменных id/type)
]
ignore = [
  "E501",                                       # длина строки: тексты бот-сообщений длиннее 88, рвать насильно хуже
  "RUF001", "RUF002", "RUF003",                 # кириллица в строках/докстрингах/комментариях - русскоязычный флот
  "ANN401",                                     # Any допустим на границах фреймворка (aiogram **kwargs middleware)
  "G004",                                       # f-string в логах: читаемость выше lazy-format, redaction идёт по итоговой строке
  "G201",                                       # error(..., exc_info=True) допустим наравне с exception()
  "TRY002", "TRY003",                           # доменные исключения и длина сообщений - вкусовые, чинятся по касанию
  "TRY301",                                     # raise внутри try -> abstraction: шумит на мелких хендлерах
  "TRY400",                                     # error vs exception в except: уровень лога - решение автора (ожидаемые ошибки)
  "RUF012",                                     # ClassVar-аннотации: шумит на декларативных классах aiogram/dialog
  "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM117",  # упрощалки if/with - местами читаемость хуже
  "DTZ003", "DTZ005", "DTZ007", "DTZ011",       # naive datetime: инфра живёт в UTC (Fly), точечные tz-фиксы по касанию
  "E712",                                       # == True обязателен в SQLAlchemy-фильтрах, автофикс ломает запросы
  "B007",                                       # неиспользуемая loop-переменная - осознанный стиль перечислений
  "RET504",                                     # присваивание перед return помогает отладке/именованию результата
  "C408",                                       # dict()/list() литералами - вкусовое
  "ASYNC109", "ASYNC110",                       # timeout-параметр и sleep-poll паттерны aiogram - ложные срабатывания
  "S311",                                       # random для не-крипто задач (шаффл текстов) - ок
]
fixable = ["ALL"]

[lint.flake8-builtins]
# Без strict-checking A005 не ловит ПАКЕТЫ-шедоуеры (<pkg>/logging/__init__.py) -
# ровно мотивирующий кейс D7. Требует ruff >= 0.15 (поэтому флот единообразно на 0.16.0).
strict-checking = true
