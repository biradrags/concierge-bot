[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bali_concierge"
version = "0.1.0"
description = "Bali Concierge Telegram Bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.20.0,<3.21.0",
    "asyncpg>=0.29.0,<0.30.0",
    "alembic>=1.13.3,<2.0",
    "psycopg>=3.2.3,<4.0",
    "psycopg-binary>=3.2.3,<4.0",
    "pydantic>=2.10.6,<2.12.0",
    "pydantic-settings>=2.9.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "SQLAlchemy>=2.0.25,<3.0",
    "colorlog>=6.8.0,<7.0.0",
    "aiohttp>=3.9.5,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5,<9.0",
    "pytest-asyncio>=0.26.0,<0.27.0",
    "pytest-cov>=4.1.0,<5.0",
]

[tool.setuptools]
packages = ["bali_concierge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
