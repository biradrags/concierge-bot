[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bali_concierge"
version = "0.1.0"
description = "Bali Concierge Telegram Bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0,<4.0",
    "aiogram-dialog>=2.5.0,<3.0",
    "asyncpg>=0.29.0,<0.30.0",
    "alembic>=1.13.3,<2.0",
    "psycopg>=3.2.3,<4.0",
    "psycopg-binary>=3.2.3,<4.0",
    "pydantic>=2.13.0,<3.0",
    "pydantic-settings>=2.9.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "SQLAlchemy>=2.0.25,<2.1",
    "aiohttp>=3.9.5,<4.0",
    "dishka>=1.10.1,<2.0",
    "greenlet>=3.2.0,<4.0",
    "redis>=6.0.0,<7.0.0",
    "maxo[dishka]>=0.9.0,<1.0",
    "agent-framework-core>=1.22.0,<1.23",
    "agent-framework-openai>=1.17.0,<1.18",
    "agent-framework-redis>=1.0.0b261015,<2.0",
    "bira-core @ git+https://github.com/biradrags/bira-core@v0.3.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5,<9.0",
    "pytest-asyncio>=0.26.0,<0.27.0",
    "pytest-cov>=4.1.0,<5.0",
]
lint = [
    "ruff>=0.16,<0.17",
    "mypy>=1.13.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["concierge_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: нужен PostgreSQL (make docker-up)"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["agent_framework_redis.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["ANN", "ARG", "BLE", "S", "E741", "DTZ", "B904"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Нижние границы транзитивов под Dependabot (critical/high); снять, когда прямые зависимости сами их поднимут.
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "mako>=1.3.12",
]
