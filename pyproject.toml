[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bali_concierge"
version = "0.1.0"
description = "Bali Concierge Telegram Bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.20.0,<3.21.0",
    "aiogram-dialog>=2.5.0,<3.0",
    "asyncpg>=0.29.0,<0.30.0",
    "alembic>=1.13.3,<2.0",
    "psycopg>=3.2.3,<4.0",
    "psycopg-binary>=3.2.3,<4.0",
    "pydantic>=2.10.6,<2.12.0",
    "pydantic-settings>=2.9.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "SQLAlchemy>=2.0.25,<3.0",
    "colorlog>=6.8.0,<7.0.0",
    "aiohttp>=3.9.5,<4.0",
    "dishka>=1.3.0,<2.0",
    "greenlet>=3.2.0,<4.0",
    "redis>=6.0.0,<7.0.0",
    "maxo[dishka]>=0.5.0",
    "agent-framework>=1.4.0,<1.5",
    "agent-framework-openai>=1.4.0,<1.5",
    "agent-framework-redis>=1.0.0b260319,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5,<9.0",
    "pytest-asyncio>=0.26.0,<0.27.0",
    "pytest-cov>=4.1.0,<5.0",
]
lint = [
    "ruff>=0.16,<0.17",
    "mypy>=1.13.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["concierge_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["ANN", "ARG", "BLE", "S", "E741", "DTZ", "B904"]

[tool.uv]
prerelease = "allow"
